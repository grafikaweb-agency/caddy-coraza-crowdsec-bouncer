name: Build and publish Caddy Coraza CrowdSec bouncer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Containerfile
      - .github/workflows/publish.yml
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: caddy-coraza-crowdsec-bouncer
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ghcr.io/grafikaweb-agency/caddy-coraza-crowdsec-bouncer:latest
            ghcr.io/grafikaweb-agency/caddy-coraza-crowdsec-bouncer:${{ github.sha }}
          cache-from: type=gha,scope=caddy-coraza-crowdsec-bouncer
          cache-to: type=gha,mode=max,scope=caddy-coraza-crowdsec-bouncer
