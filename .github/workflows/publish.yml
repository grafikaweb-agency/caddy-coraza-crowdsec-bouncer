name: WAF compatibility and publication

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: waf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compatibility:
    name: WAF compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test major-release monitoring
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          load: true
          tags: waf:ci
          cache-from: type=gha,scope=waf-compatibility
          cache-to: type=gha,mode=max,scope=waf-compatibility
      - name: Test Caddy, Coraza and CrowdSec together
        run: python3 tests/integration.py
      - name: Save the tested image
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: docker save waf:ci | gzip > /tmp/waf-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        with:
          name: tested-waf-image
          path: /tmp/waf-image.tar.gz
          retention-days: 1

  publish:
    needs: compatibility
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-waf-image
          path: /tmp
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact image that passed the tests
        run: |
          gunzip -c /tmp/waf-image.tar.gz | docker load
          image=ghcr.io/grafikaweb-agency/caddy-coraza-crowdsec-bouncer
          docker tag waf:ci "$image:${{ github.sha }}"
          docker tag waf:ci "$image:latest"
          docker push "$image:${{ github.sha }}"
          docker push "$image:latest"
